<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FashionStore SaaS · Plataforma de Moda</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e05a47">
  <meta name="description" content="FashionStore: gestión integral de inventario, ventas y atención al cliente en una sola plataforma.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="/img/pwa/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- Componente oficial Google model-viewer para Probador Virtual (3D y Realidad Aumentada). -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((error) => {
          console.error('No se pudo registrar el Service Worker de FashionStore.', error);
        });
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

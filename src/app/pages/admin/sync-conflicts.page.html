<div class="page-container">
  <div class="page-header">
    <h1>Discrepancias de Inventario (Post-Sincronización)</h1>
    <button class="btn-secondary" (click)="load()">Actualizar</button>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th># Venta</th>
          <th>Fecha</th>
          <th>Sucursal</th>
          <th>Total (Bs)</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of conflicts()">
          <td>{{c.id}}</td>
          <td>{{c.sale_date | date:'short'}}</td>
          <td>{{c.branch_id}}</td>
          <td>{{c.total | number:'1.2-2'}}</td>
          <td><span class="badge conflict">CONFLICTO</span></td>
          <td>
            <button class="btn-primary" (click)="resolve(c.id)">Resolver (administrativo)</button>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="!loading() && conflicts().length === 0" class="empty">Sin discrepancias pendientes</div>
  </div>
</div>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos con hash en el nombre se pueden cachear para siempre
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index nunca se cachea: contiene las referencias con hash
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Rutas de Angular (SPA): cualquier ruta desconocida devuelve el index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OPCIÓN: proxy inverso para servir la API en el mismo origen (evita CORS).
    # Si lo activas, cambia en src/environments/environment.production.ts apiUrl a '/api/v1'
    # y asegúrate de que el contenedor de la API se llame `api` en la misma red de Docker.
    # location /api/ {
    #     proxy_pass http://api:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
